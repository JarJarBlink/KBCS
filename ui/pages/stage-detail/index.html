<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>KBCS</title><link rel="icon" href="/images/kbc-logo.png"><link rel="stylesheet" href="/src/shared/ui/site.css"><link rel="stylesheet" href="/src/features/units/style.css"><link rel="stylesheet" href="/src/features/stages/style.css"><link rel="stylesheet" href="/native.css"><script type="module" src="/src/app/main.js"></script><script type="module" src="/stage-detail.js"></script></head>
<body data-page="stage-detail"><div class="site-shell"><a class="skip-link" href="#main">本文へ移動</a><header class="site-header"><a class="brand" href="/" aria-label="KBCS ホーム"><img src="/images/kbc-logo.png" alt="" width="28" height="28"><span>KBCS</span></a><nav class="site-nav" aria-label="サイト"><a href="/">ホーム</a><a href="/pages/unit-search/">キャラ検索</a><a href="/pages/tunit-search/">敵検索</a><a href="/pages/stage-search/">ステージ</a></nav><div class="theme-switcher" role="group" aria-label="表示テーマ"><button type="button" class="theme-button" data-theme-value="original" aria-label="濃紺" title="濃紺"><span class="theme-dot theme-dot-original" aria-hidden="true"></span></button><button type="button" class="theme-button" data-theme-value="dark" aria-label="ダーク" title="ダーク"><span class="theme-dot theme-dot-dark" aria-hidden="true"></span></button><button type="button" class="theme-button" data-theme-value="light" aria-label="ライト" title="ライト"><span class="theme-dot theme-dot-light" aria-hidden="true"></span></button></div><button type="button" class="site-settings-trigger" data-site-settings>設定</button></header><main id="main" class="page-main stage-page">
<div class="db-toolbar"><a href="/pages/stage-search/">ステージ検索へ</a><span id="stage-version" class="db-meta"></span></div>
<p id="stage-status" role="status">ステージデータを読み込んでいます。</p><button id="stage-retry" type="button" hidden>再読み込み</button>
<nav id="stage-navigation" aria-label="このマップのステージ"></nav>
<div id="stage-detail-controls" class="stage-display-controls"><span class="stage-detail-mode"><label><input id="stage-display-mode" type="checkbox">詳細表示</label><button id="stage-detail-settings-open" type="button" aria-haspopup="dialog" hidden>詳細表示設定</button></span><label><input id="stage-time" type="checkbox">F表示</label><label><input id="stage-enemy-stats" type="checkbox">敵ステータスを表示</label></div>
<section id="stage-content" aria-busy="true"><div id="stage-map-info"><table class="data-sheet db-table" aria-label="マップ情報">
<colgroup><col class="data-sheet-label"><col><col class="data-sheet-label"><col></colgroup>
<thead><tr><th colspan="4"><div class="stage-sheet-heading"><h1>マップ情報</h1></div></th></tr></thead>
<tbody><tr><th scope="row">ステージ数</th><td></td><th scope="row">マップ難易度</th><td></td></tr>
<tr><th scope="row">冠倍率</th><td colspan="3"></td></tr></tbody></table></div><div id="stage-output"></div></section>
<dialog id="stage-detail-settings" class="db-dialog stage-detail-settings" aria-labelledby="stage-detail-settings-heading"><form method="dialog">
<h2 id="stage-detail-settings-heading">詳細表示設定</h2>
<p>チェックした項目を詳細表示で非表示にします。</p>
<div id="stage-detail-settings-fields" class="stage-detail-settings-fields"></div>
<div class="stage-detail-settings-actions"><button type="submit" value="cancel">取消</button><button type="submit" value="apply">適用</button></div>
</form></dialog>
<dialog id="stage-xp-dialog" class="db-dialog stage-xp-dialog" aria-labelledby="stage-xp-heading"><form method="dialog">
<h2 id="stage-xp-heading">獲得XPの計算条件</h2>
<label>クリア済み回数 <input id="stage-xp-clears" type="number" min="0" max="2147483647" required></label>
<label>XPコンボ合計（%） <input id="stage-xp-combo" type="number" min="0" max="100" required></label>
<label><input id="stage-xp-okame" type="checkbox">おかめはちもく</label>
<div id="stage-xp-profile" class="db-meta"></div><button type="submit">適用</button>
</form></dialog>
<output id="stage-message" role="status"></output></main></div></body></html>
