<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>DBの表示設定 | KBCS</title><link rel="icon" href="/images/brand/app-icon.png"><link rel="stylesheet" href="/src/shared/ui/site.css"><link rel="stylesheet" href="/src/features/stages/style.css"><link rel="stylesheet" href="/native.css"><link rel="stylesheet" href="/src/shared/ui/display-editor.css"><script type="module" src="/src/app/main.js"></script><script type="module" src="/display-settings.js"></script></head>
<body data-page="display-settings"><div class="site-shell"><header class="site-header"><a class="brand" href="/"><img src="/images/brand/app-icon.png" alt="" width="28" height="28"><span>KBCS</span></a><nav class="site-nav" aria-label="サイト"><a href="/">ホーム</a></nav><button type="button" class="site-settings-trigger" data-site-settings>設定</button></header>
<main id="main" class="page-main"><div class="db-toolbar"><a href="/pages/settings/">設定へ</a><a id="display-open-detail" href="/pages/stage-detail/">ステージ詳細を開く</a></div><h1>DBの表示設定</h1>
<label>データベース <select id="display-database"><option value="stages">ステージ</option></select></label>
<div class="display-editor-layout"><section aria-label="表示項目の編集" id="display-editor"></section><section aria-label="プレビュー"><h2>プレビュー</h2>
<div class="db-toolbar"><label>マップ・ステージを検索 <input type="search" id="display-map-query"></label><label>マップ <select id="display-map"></select></label><label>ステージ <select id="display-stage"></select></label></div>
<div class="db-toolbar"><label>冠 <select id="display-crown"></select></label><label>表示 <select id="display-mode"><option value="basic">通常</option><option value="detail">詳細</option></select></label><label>単位 <select id="display-time"><option value="seconds">秒</option><option value="frames">F</option></select></label><label><input type="checkbox" id="display-stats">敵ステータス</label></div>
<output id="display-preview-status" role="status"></output><div id="display-preview-map"></div><div id="display-preview-stage"></div></section></div></main></div></body></html>
